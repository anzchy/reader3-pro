<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · Reader3 Pro</title>
  <link rel="stylesheet" href="/static/settings.css">
</head>
<body>
  <div class="container" data-testid="set-screen">
    <div class="topbar" data-testid="set-topbar">
      <a class="link" href="/" data-testid="set-topbar-back-to-library">← Back to Library</a>
      <div class="title">Settings</div>
    </div>

    <div class="section">
      <h2>AI Preferences</h2>
      <div class="row">
        <label class="label">
          Default provider
          <select id="settings-default-provider"></select>
        </label>
      </div>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="settings-streaming-enabled" checked>
          Streaming enabled (when supported)
        </label>
      </div>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="settings-show-timestamps" checked>
          Show timestamps
        </label>
      </div>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="settings-auto-suggest" checked>
          Auto suggested questions (future)
        </label>
      </div>
      <div class="row">
        <button id="settings-save-preferences" class="btn">Save preferences</button>
        <span id="settings-pref-status" class="status"></span>
      </div>
    </div>

    <div class="section">
      <h2>Providers</h2>
      <div id="settings-providers" class="providers"></div>
    </div>

    <div class="section">
      <h2>Data</h2>
      <div class="row">
        <button id="settings-clear-conversations" data-testid="set-data-conversations" class="btn btn-danger">Clear conversations (IndexedDB)</button>
        <button id="settings-clear-summaries" data-testid="set-data-cache" class="btn btn-danger">Clear summaries (IndexedDB)</button>
        <span id="settings-data-status" class="status"></span>
      </div>
      <div class="row">
        <button id="settings-export-config" data-testid="set-export-settings" class="btn">Export settings (no keys)</button>
        <label class="btn" style="display:inline-flex; align-items:center; gap:8px;">
          Import settings
          <input id="settings-import-config" type="file" accept="application/json" style="display:none;" />
        </label>
        <span id="settings-config-status" class="status"></span>
      </div>
      <div class="hint">
        Clearing data only affects this browser profile. It does not touch your books on disk.
      </div>
    </div>
  </div>

  <script src="/static/settings.js"></script>
</body>
</html>
