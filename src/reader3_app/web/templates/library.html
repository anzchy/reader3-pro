<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="/static/search.css">
    <link rel="stylesheet" href="/static/library.css">
</head>
<body>
    <div class="container">
        <h1>Library</h1>
        <div style="margin-top: 8px; margin-bottom: 10px;">
            <a href="/settings" class="btn" style="background:#6b7280;">Settings</a>
        </div>

        <div class="search-box">
            <input type="text" id="library-search-input" placeholder="Search across your library…" autocomplete="off" />
            <div class="search-actions">
                <button type="button" class="search-btn" id="library-search-clear">Clear</button>
                <label>
                    <input type="checkbox" id="library-search-case" />
                    Case
                </label>
                <label>
                    Mode
                    <select id="library-search-mode">
                        <option value="keyword">keyword</option>
                        <option value="semantic">semantic</option>
                        <option value="hybrid">hybrid</option>
                    </select>
                </label>
                <label>
                    Sort
                    <select id="library-search-sort">
                        <option value="relevance">relevance</option>
                        <option value="book_title">title</option>
                        <option value="book_author">author</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="library-search-panel" id="library-search-panel" style="display:none;">
            <div class="search-status" id="library-search-status"></div>
            <div id="library-search-results"></div>
        </div>

        {% if not books %}
            <p>No processed books found. Run <code>reader3.py</code> on an epub first.</p>
        {% endif %}

        <div class="book-grid" id="library-book-grid">
            {% for book in books %}
            <div class="book-card">
                <div class="book-title">{{ book.title }}</div>
                <div class="book-meta">
                    {{ book.author }}<br>
                    {{ book.chapters }} sections
                </div>
                <a href="/read/{{ book.id }}/0" class="btn">Read Book</a>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="/static/library-search.js"></script>
</body>
</html>
