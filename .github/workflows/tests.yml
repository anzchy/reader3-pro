# 008 的测试 CI。`lint.yml` 的头部注释里 007 已经定过：测试 CI 单独建一个文件，
# 与那边不合并——因为两者的依赖前提不同（`lint.yml` 的 `contracts` job 刻意零依赖，
# 好让它在还没有 `tests/` 的早期分支上也能跑；这里必须 `uv sync`）。
#
# **本文件刻意不做的三件事**（它们在 `lint.yml` 里已有唯一定义处，重复记账只会漂移）：
#   - 两条 testid lint 与 token 悬空引用 lint → `lint.yml` 的 `contracts` job
#   - wheel 内容对账（`check_wheel_contents.py`）  → `lint.yml` 的 `wheel` job
#   - 装出来能跑（`smoke_installed_wheel.py`）      → `lint.yml` 的 `wheel` job
#     （同一个脚本另有一份 pytest 包装在 `tests/integration/`，由本地 packaging lane
#      在 push 时跑。CI 这一遍环境更干净，是第三档节奏，见那个文件的 docstring。）
#
# **两个 job**：`unit`（静态检查 ＋ unit lane ＋ 覆盖率门禁）与 `e2e`
# （`baseline_1b` 全量首次通过 ＋ 余下各组）。`e2e` 是 2026-09-20 补的，兑付欠账 #31，
# 同时充当迁移计划 §7「机制挑战闸」第一项的载体 —— 理由与判据写在它自己头上，
# 不在这里重述。两个 job 并行、互不依赖：e2e 挂了也要看得见 unit 是绿是红。
#
# **触发时机：发版时跑，向 `master` 开 PR 时也跑；日常 push 到分支仍然不跑。**
# 发版两条路径都认（只打 tag / 在 GitHub 上 Publish Release），concurrency 按 ref
# 归组取消旧的，所以同一个 tag 不会跑两遍。
#
# **`pull_request` 是 2026-09-23 补的**，它买的是一件此前**一次都没做到过**的事：
# GitHub 在 `pull_request` 上跑的是 `refs/pull/N/merge`，即**分支并进 base 之后的那棵树**。
# 此前全部「CI 全绿」的证据都是 `workflow_dispatch` 打在**分支头**上的（011 在 `4af73cc`、
# 017 在 `255b63a`），而真正落到 `master` 的是 merge commit（`4128221` / `6df5026`）——
# 两者的字节不保证相同，**合并结果从来没有被 CI 验过一次**。实测：`master` 上最后一次
# run 是 2026-09-20 的 `e7c4890`，此后那三个 master commit 上的 run 数都是 0。
#
# **仍然不加 `push` 触发。** 那是维护者 2026-08-23 定的口径，本次没动：日常 push 的护栏
# 由 `.claude/tdd-guardian/config.json` 的三条 lane 承担（unit 在 taskCompleted/commit，
# packaging 与 e2e 在 push）。
#
# **本工作流仍不设 required check，但此前那条理由已经不成立了。** 原文是「一个日常不跑的
# 检查设成 required，只会把每个 PR 卡死在『Expected — Waiting for status』上」——加了
# `pull_request` 之后它每个 PR 都会跑，那个失败形态没有了。设不设 required 要改 GitHub 上的
# 分支保护规则，不是本文件能决定的事，**留给维护者裁**。
#
# 代价写明白（与 `lint.yml` 同源）：
#   1. **本地门禁绕得过**——`git commit --no-verify` 一行就跳过。它挡的是手滑，不是决心。
#   2. **中间攒下的问题仍会堆着**，只是最晚堆到开 PR 那一刻，不再堆到发版当天。
#      分支上想提前验，`workflow_dispatch` 仍在：`gh workflow run tests.yml`。
#   3. **新代价：`e2e` job 现在进了每个 PR 的路径。** 它跑 `baseline_1b` 全量 Playwright，
#      而这套用例在干净 Linux 上只成功过一次（run 35584711194）。它要是 flaky，红的就是 PR
#      而不是发版日。这正是机制挑战闸第 1 项要回答的问题——闸没过之前，别把它设成 required。
#
# ⚠️ **action 版本尚未在 CI 里实跑验证过。** `workflow_dispatch` 只对**默认分支上存在的
# workflow** 生效，所以本文件在 008 合入 `master` 之前无法被触发一次。合入后的第一件事：
# `gh workflow run tests.yml` 跑一遍，绿了再谈别的。下面的步骤命令本身在本地验过。
name: tests

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  # 跑的是 refs/pull/N/merge（分支并进 base 之后的树），不是分支头——理由见文件头。
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 静态检查 ＋ unit lane（含覆盖率门禁）＋ fe-unit lane
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0：REG-1 的 C9.23（tests/unit/test_reg1_snapshot_metadata.py）要在对象库里
      # 找到基线 commit 671f580；默认的深度 1 检出没有它，那条用例会（按设计）红而不是 skip。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 013 WI-9：unit lane 里有几条用例驱动 Node（depcruise、Vitest 宿主的三条），
      # 它们在没有 node_modules 时判红、不 skip。Node 版本读 .nvmrc，与本地同一处定义。
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: npm ci
        run: npm ci

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      # `--frozen` 让 uv.lock 参与解析。这与 `lint.yml` 的 wheel job 刚好相反——
      # 那边故意不用 lock，因为它守的就是「依赖漂移在干净环境里炸掉」。
      # 两个方向都要有人测，所以两处不能统一。
      - name: uv sync
        run: uv sync --frozen --all-groups

      # 四步分开跑、且都带 `if: always()`：失败时要能一眼看出是哪一步，
      # 而不是「第一步挂了，后三步没跑，不知道它们是绿是红」。
      - name: ruff（含 BLE 盲捕与 S110 裸 pass，规则见 AGENTS.md）
        run: uv run ruff check src/ tests/ scripts/

      # 这里**故意没有** `ruff format --check`。
      # `pyproject.toml` 里的 `line-length = 120` 是为了「以后开 E501 时别一次
      # 多出几百条」而设的上限，不是格式目标。拿它当格式目标跑 `ruff format`，
      # 会把测试里刻意折行的断言和参数列表合并成 120 字符长行——全仓 34/55 个
      # 文件会被改，可读性只降不升。格式化如果要做，是它自己的一个机械分支，
      # 不是安全网分支顺手夹带的。

      - name: mypy
        if: always()
        run: uv run mypy src/

      # 与 `.claude/tdd-guardian/config.json` 的 unit lane 同一条命令。
      # 两处必须一致：本地绿 CI 红（或反过来）会让人不再相信任一处。
      - name: unit lane（tests/unit ＋ tests/contract，含覆盖率）
        if: always()
        run: >
          uv run pytest tests/unit tests/contract
          --cov=src/reader3_app
          --cov-report=json:coverage-unit.json
          --cov-report=term

      # 覆盖率阈值的唯一定义处是 `.claude/tdd-guardian/config.json` 的
      # `coverageThresholds`，本文件不重述数字——读它、按它判。
      - name: 覆盖率门禁（阈值读 tdd-guardian 配置，本文件不重述）
        if: always()
        run: python3 scripts/check_coverage_gate.py

      # 与 `.claude/tdd-guardian/config.json` 的 fe-unit lane 同一条命令（013 WI-9，D4）。
      - name: fe-unit lane（Vitest ＋ jsdom，frontend/tests）
        if: always()
        run: npm test

      - name: 保留覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 欠账 #31 的兑付：§7 承诺过的「发版关门检查里跑一次 baseline-1b 全量」。
  # ⚠️ 本文件**不写条数**。条数的唯一定义处是 `scripts/lint_e2e_groups.py` 的
  # `EXPECTED_BASELINE_ITEMS`，真正的断言在 `scripts/soak_run.py`，从那里派生。
  # 这里早先誊抄过具体条数，没有一个参与判定，却每次都烂：2026-09-21 冻结集改判一次，
  # 2026-09-30 009 #62（019 WI-4）迁入 8 条一次，2026-10-01 023 #65 迁入 56 条又一次。
  # 所以 023 起改成不带数字的写法（「条数 = EXPECTED_BASELINE_ITEMS」），条数再变时这里不用动。
  # 该承诺 2026-08-16 立下，2026-09-18 复核时发现从未建出来（全仓 workflow 无
  # Playwright、无 e2e），2026-09-19 裁定为「建 job，不删承诺」，本 job 即是。
  #
  # **跟着上面那个 `on:` 走，一个触发器都不新增**（release.published / push.tags: v* /
  # pull_request → master / workflow_dispatch）。所以它**也跑在每个向 `master` 开的 PR 上**
  # （2026-09-23 起，理由与代价见文件头）；日常 push 到分支不跑，日常门禁仍归本地
  # tdd-guardian 的 lane（`.claude/tdd-guardian/config.json`）。不加 `push` 触发是
  # 2026-08-23 定的全仓口径，不为这个 job 破例。
  #
  # **它同时是迁移计划 §7「机制挑战闸」第一项（干净 Linux / CI 环境）的载体。**
  # 那道闸的通过条件是 baseline_1b 全量**首次**通过（条数 = EXPECTED_BASELINE_ITEMS；重试通过不算绿，只能用来分类），
  # 固定项是 lock 文件与 Chromium 版本、两者连同结果一并记录 —— 所以下面
  # `uv sync --frozen`（lock 参与解析）与「记录 Chromium 版本」这一步都是判据的一部分，
  # 不是顺手加的。结果往 `tasks/soak-log.md` 的机制挑战闸表里记，**不往 soak 台账追行**：
  # 那 10 次数的是一个固定的本地运行剖面，CI 换了剖面，混进去就是拿不同条件拼「连续」。
  #
  # 为什么用 `scripts/soak_run.py` 而不是直接 `pytest tests/e2e -m baseline_1b`：
  # 后者绿了只说明「没红」，而这道闸要的是**全量通过**。soak_run 会断言 passed == EXPECTED_BASELINE_ITEMS、
  # skipped/failed/errors == 0、deselected == 验收 + 白名单（派生，不是字面量），
  # 并复核 `suite_hash` 与台账表头的冻结值逐字符相同 —— 「用例被悄悄删了一半然后全绿」
  # 这种形状只有它拦得住。**不传 `--append`**，CI 这一跑不进台账。
  e2e:
    name: e2e baseline_1b（干净 Linux ＋ 冻结 lock，全量首次通过）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0：「e2e 余下各组」那一步会跑 tests/e2e/shell_4a（REG-1），其中 C9.38
      # 用 `git worktree add` 检出 671f580 重拍一次快照；深度 1 的检出没有那个 commit。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      # 与 unit job 同口径：`--frozen` 让 uv.lock 参与解析。这里还多一层意思——
      # 机制挑战闸第一项要求「锁定 lock 文件」，`--frozen` 就是那把锁。
      - name: uv sync
        run: uv sync --frozen --all-groups

      # `--with-deps` 装的是 Chromium 在干净 ubuntu 上缺的系统库。少了它，
      # 浏览器起不来的报错会长得像用例失败，而那是环境失败，两者不该同形。
      - name: 装 Chromium
        run: uv run playwright install --with-deps chromium

      # 闸的固定项之一，必须留痕：出了问题要能回答「那次跑的是哪个 Chromium」。
      # 台账里 `browser` 列记的就是这个 revision（本地历史值是 chromium-1234）。
      - name: 记录 Chromium 版本（闸的固定项，要连同结果一起抄进 soak-log）
        run: |
          uv run playwright --version
          ls -1 ~/.cache/ms-playwright | grep -E '^chromium' || true

      # `--log-dir` 不是可省的。不给它时 `soak_run.py:746` 会把明细 log 写进
      # `tempfile.mkdtemp()`（这是对的——dry run 不该往仓库里拉屎），于是控制台只剩
      # 一行 summary，**红了也说不出是哪条用例**。2026-09-20 首次真跑就栽在这上面：
      # 闸红了，`1 failed, 66 passed`，而明细在 /tmp/soak-ozvxvjvu/ 里随 runner 一起没了。
      # 一道说不出「谁红了」的闸，等于逼人把它重跑一遍才能开始查。
      - name: baseline_1b 全量首次通过（条数 = EXPECTED_BASELINE_ITEMS，不落台账）
        run: uv run python scripts/soak_run.py --log-dir soak-ci-logs

      # baseline 之外那些条（验收组 ＋ 白名单模块）单独跑一遍，不与上面重复：
      # `-m baseline_1b` 必然把它们 deselect 掉，上一步再绿也证明不了它们。
      # 绝大多数仍是 skip（未激活的验收组），跑一遍是为了确认「该 skip 的在 skip、
      # 已激活的在真跑」——acceptance_2a 自 WI-5b 起已激活。
      - name: e2e 余下各组（验收组 ＋ 白名单模块）
        if: always()
        run: uv run pytest tests/e2e -m "not baseline_1b" --browser chromium -q

      - name: 保留 Playwright / 服务端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            test-results/
            soak-ci-logs/
          if-no-files-found: ignore
          # 这里**故意不收** `.claude/tdd-guardian/soak-logs/`：那是随 checkout 带进来的
          # 历史 log，不是本次运行的产物。首次真跑时收的就是它——4193 字节，全是噪声，
          # 而本次真正的明细一个字节都没收到。
