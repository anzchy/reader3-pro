[project]
name = "reader3"
version = "0.1.0"
description = "Simple EPUB reader web app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.3.7",
    "ebooklib>=0.20",
    "fastapi>=0.121.2",
    "ipywidgets>=8.1.8",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "sentence-transformers>=5.2.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
reader3 = "reader3_app.reader3:main"
reader3-server = "reader3_app.web.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reader3_app.web" = ["templates/*.html", "static/*"]
