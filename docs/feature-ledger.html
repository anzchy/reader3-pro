<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1b1d21; --muted: #5d636d; --line: #dcdfe4; --chip: #eef0f3;

}

    --accepted: #6fd08f; --accepted-bg: #15301f;
    --partial: #f2bd4b; --partial-bg: #3a2c0d;
    --stub: #c9a2f5; --stub-bg: #2c1d40;
    --absent: #f59ac4; --absent-bg: #3d1a2c;
    --unknown: #6fd3de; --unknown-bg: #0f3035;
    --deprecated: #b7bcc4; --deprecated-bg: #2a2e35;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Noto Sans", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; }

.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-accepted { color: var(--accepted); background: var(--accepted-bg); }
.s-partial { color: var(--partial); background: var(--partial-bg); }
.s-stub { color: var(--stub); background: var(--stub-bg); }
.s-absent { color: var(--absent); background: var(--absent-bg); }
.s-unknown { color: var(--unknown); background: var(--unknown-bg); }
.s-deprecated { color: var(--deprecated); background: var(--deprecated-bg); }
.s-superseded { color: var(--superseded); background: var(--superseded-bg); }
.s-removed { color: var(--removed); background: var(--removed-bg); }
.bar .s-accepted, .dotc.s-accepted { background: var(--accepted); }
.bar .s-partial, .dotc.s-partial { background: var(--partial); }
.bar .s-stub, .dotc.s-stub { background: var(--stub); }
.bar .s-absent, .dotc.s-absent { background: var(--absent); }
.bar .s-unknown, .dotc.s-unknown { background: var(--unknown); }
/* Not-shipped statuses: dashed badge border, and a marker on the row head (CSS only). */
.badge.s-stub, .badge.s-absent, .badge.s-unknown { border-style: dashed; }
.row-head .badge.s-stub::after, .row-head .badge.s-absent::after, .row-head .badge.s-unknown::after {
  content: "not shipped"; font-weight: 400; font-size: 11px; opacity: .85; padding-left: 5px; border-left: 1px dashed currentColor; }
.row-head .lim { background: none; }

.row-head .lim.s-absent { color: var(--absent); }
.row-head .lim.s-unknown { color: var(--unknown); }
.audit { margin-top: 28px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.timeline > li { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.timeline > li::before { content: ""; position: absolute; left: -25px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--focus); border: 2px solid var(--bg); }
.timeline .a-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.timeline .a-date { color: var(--muted); }
.timeline .a-title { font-weight: 600; }
.timeline dl { padding: 8px 0 0; margin-top: 8px; grid-template-columns: 96px 1fr; }
.bar .s-deprecated, .dotc.s-deprecated { background: var(--deprecated); }

.bar .s-removed, .dotc.s-removed { background: var(--removed); }
.dotc { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.chev { transition: transform .15s; display: inline-block; margin-left: 6px; color: var(--muted); }
.row.open .chev { transform: rotate(90deg); }
dl { margin: 0; padding: 4px 12px 12px 82px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
dt { color: var(--muted); font-size: 12.5px; }
dd { margin: 0; min-width: 0; }
dd ul { margin: 0; padding: 0; list-style: none; }
dd .mono { overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }

  .row-head { grid-template-columns: 50px 1fr; }
  .row-head .badge { grid-column: 2; justify-self: start; }
  .row-head .sm, .row-head .lim { grid-column: 1 / 3; }

}

  <div class="list" id="list"></div>
  <section class="audit" aria-labelledby="h-audit"><h2 id="h-audit">Audit log</h2><ol class="timeline" id="audit"></ol></section>
  <footer>Rendered from the embedded <code>#ledger-data</code> JSON. Rules, update checklist and debt references live in <code>docs/feature-ledger.md</code>.</footer>
</main>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("ledger-data").textContent);
  var F = DATA.features, STATUSES = DATA.statuses;
  var AREAS = [];
  F.forEach(function (f) { if (AREAS.indexOf(f.area) < 0) AREAS.push(f.area); });
  var state = { status: [], area: [], q: "", open: [] };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  // Render `backtick` spans as <code> without ever using innerHTML on data.
  function rich(parent, text) {
    String(text).split("`").forEach(function (part, i) {
      if (!part) return;
      parent.appendChild(i % 2 ? el("code", null, part) : document.createTextNode(part));
    });
    return parent;
  }
  function baseStatus(s) { return String(s).split(/\s/)[0]; }
  function badge(s) { return el("span", "badge s-" + baseStatus(s), s); }
  function stackBar(bar, list) {
    bar.textContent = "";
    var parts = [];
    STATUSES.forEach(function (s) {
      var n = list.filter(function (f) { return baseStatus(f.status) === s; }).length;
      if (!n) return;
      var seg = el("span", "s-" + s);
      seg.style.width = (100 * n / list.length) + "%";
      seg.title = s + ": " + n;
      bar.appendChild(seg);
      parts.push(n + " " + s);
    });
    bar.setAttribute("aria-label", parts.join(", "));
  }

  // ---- URL hash <-> state ----
  function readHash() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ""));
    function list(k) { return (p.get(k) || "").split(",").filter(Boolean); }
    state.status = list("status").filter(function (s) { return STATUSES.indexOf(s) >= 0; });
    state.area = list("area").filter(function (a) { return AREAS.indexOf(a) >= 0; });
    state.q = p.get("q") || "";
    state.open = list("open");
  }
  function writeHash() {
    var p = new URLSearchParams();
    if (state.status.length) p.set("status", state.status.join(","));
    if (state.area.length) p.set("area", state.area.join(","));
    if (state.q) p.set("q", state.q);
    if (state.open.length) p.set("open", state.open.join(","));
    var h = p.toString();
    history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
  }

  // ---- static parts ----
  document.getElementById("synced").appendChild(rich(el("span"),
    "Synced " + DATA.synced_at + " at commit `" + DATA.commit + "` from `" + DATA.synced_from +
    "`, which is authoritative. This page is only a view of it."));
  var AUDIT = DATA.audit || [];
  if (AUDIT.length) document.getElementById("synced").appendChild(el("span", null, " · last audit " + AUDIT[0].date));

  var counts = document.getElementById("counts");
  STATUSES.forEach(function (s) {
    var n = F.filter(function (f) { return baseStatus(f.status) === s; }).length;
    var c = el("span", "count" + (n ? "" : " zero"));
    c.appendChild(el("b", null, n));
    c.appendChild(badge(s));
    counts.appendChild(c);
  });
  stackBar(document.getElementById("bar"), F);

  var areas = document.getElementById("areas");
  AREAS.forEach(function (a) {
    var fs = F.filter(function (f) { return f.area === a; });
    var r = el("div", "area-row");
    r.appendChild(el("span", null, a));
    r.appendChild(el("span", "n", fs.length));
    var b = el("div", "bar"); stackBar(b, fs); r.appendChild(b);
    areas.appendChild(r);
  });

  function chips(container, values, key) {
    values.forEach(function (v) {
      var b = el("button", "chip", v);
      b.type = "button";
      b.dataset.value = v;
      b.addEventListener("click", function () {
        var arr = state[key], i = arr.indexOf(v);
        if (i < 0) arr.push(v); else arr.splice(i, 1);
        update();
      });
      container.appendChild(b);
    });
  }
  chips(document.getElementById("f-status"), STATUSES, "status");
  chips(document.getElementById("f-area"), AREAS, "area");

  var q = document.getElementById("q");
  q.addEventListener("input", function () { state.q = q.value; update(); });
  document.getElementById("reset").addEventListener("click", function () {
    state = { status: [], area: [], q: "", open: [] }; update();
  });

  // ---- feature list ----
  function matches(f) {
    if (state.status.length && state.status.indexOf(baseStatus(f.status)) < 0) return false;
    if (state.area.length && state.area.indexOf(f.area) < 0) return false;
    var needle = state.q.trim().toLowerCase();
    if (!needle) return true;
    var hay = [f.id, f.name, f.what, f.limits, f.confirm, f.tracked]
      .concat(f.routes, f.code, f.tests, f.adr).join("\n").toLowerCase();
    return needle.split(/\s+/).every(function (t) { return hay.indexOf(t) >= 0; });
  }
  function pathList(items) {
    if (!items.length) return el("span", "sub", "—");
    var ul = el("ul");
    items.forEach(function (p) { var li = el("li", "mono"); rich(li, p); ul.appendChild(li); });
    return ul;
  }
  // Statuses whose row head previews Limits (partial + the not-shipped ones).
  var LIMITS_PREVIEW = ["partial", "stub", "absent", "unknown"];
  function renderRow(f) {
    var isOpen = state.open.indexOf(f.id) >= 0;
    var row = el("article", "row" + (isOpen ? " open" : ""));
    var head = el("button", "row-head");
    head.type = "button";
    head.setAttribute("aria-expanded", String(isOpen));
    head.setAttribute("aria-controls", "d-" + f.id);
    head.appendChild(el("span", "id mono", f.id));
    var nm = el("span", "name", f.name); nm.appendChild(el("span", "chev", "›")); head.appendChild(nm);
    head.appendChild(badge(f.status));
    var sm = el("span", "sm");
    sm.appendChild(el("span", null, f.area));
    if (f.evidence) sm.appendChild(rich(el("span", "dot"), f.evidence));
    head.appendChild(sm);
    var base = baseStatus(f.status);
    if (LIMITS_PREVIEW.indexOf(base) >= 0 && f.limits) head.appendChild(rich(el("span", "lim s-" + base), "Limits: " + f.limits));
    head.addEventListener("click", function () {
      var i = state.open.indexOf(f.id);
      if (i < 0) state.open.push(f.id); else state.open.splice(i, 1);
      update(f.id);
    });
    row.appendChild(head);
    if (isOpen) {
      var dl = el("dl"); dl.id = "d-" + f.id;
      function add(label, node) { dl.appendChild(el("dt", null, label)); var dd = el("dd"); dd.appendChild(node); dl.appendChild(dd); }
      // Every field renders only when non-empty (absent rows carry no Code/Tests/Evidence).
      if (f.what) add("What", rich(el("span"), f.what));
      if (f.routes && f.routes.length) add("Routes", pathList(f.routes));
      if (f.code.length) add("Code", pathList(f.code));
      if (f.tests.length) add("Tests", pathList(f.tests));
      if (f.adr.length) add("ADR", el("span", "mono", f.adr.join(", ")));
      if (f.confirm) add("Confirm", rich(el("span"), f.confirm));
      if (f.tracked) add("Tracked", rich(el("span"), f.tracked));
      if (f.evidence) add("Evidence", rich(el("span"), f.evidence));
      if (f.limits) add("Limits", rich(el("span"), f.limits));
      row.appendChild(dl);
    }
    return row;
  }

  function update(focusId) {
    writeHash();
    [["f-status", "status"], ["f-area", "area"]].forEach(function (p) {
      document.querySelectorAll("#" + p[0] + " button.chip").forEach(function (b) {
        b.setAttribute("aria-pressed", String(state[p[1]].indexOf(b.dataset.value) >= 0));
      });
    });
    if (q.value !== state.q) q.value = state.q;
    var list = document.getElementById("list");
    list.textContent = "";
    var shown = F.filter(matches);
    shown.forEach(function (f) { list.appendChild(renderRow(f)); });
    if (!shown.length) list.appendChild(el("div", "empty", "No features match these filters."));
    document.getElementById("shown").textContent = "Showing " + shown.length + " of " + F.length + " features";
    if (focusId) {
      var h = document.querySelector('[aria-controls="d-' + focusId + '"]');
      if (h) h.focus();
    }
  }

  // ---- audit log (newest first, in data order) ----
  var auditList = document.getElementById("audit");
  if (!AUDIT.length) auditList.appendChild(el("li", "empty", "No audits recorded."));
  AUDIT.forEach(function (a) {
    var li = el("li");
    var head = el("div", "a-head");
    var t = el("time", "a-date mono", a.date); t.setAttribute("datetime", a.date); head.appendChild(t);
    head.appendChild(el("span", "a-title", a.title));
    head.appendChild(el("code", null, a.commit));
    li.appendChild(head);
    var dl = el("dl");
    [["Scope", a.scope], ["Found", a.found], ["Not audited", a.not_audited]].forEach(function (p) {
      if (!p[1]) return;
      dl.appendChild(el("dt", null, p[0]));
      dl.appendChild(rich(el("dd"), p[1]));
    });
    li.appendChild(dl);
    auditList.appendChild(li);
  });

  window.addEventListener("hashchange", function () { readHash(); update(); });
  readHash();
  update();
})();
</script>
</body>
</html>
